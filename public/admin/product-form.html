<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | Administração</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="admin-layout"><aside class="sidebar"><div class="brand">Lu Lou Admin</div><nav><a href="/admin/index.html">Dashboard</a><a href="/admin/products.html">Produtos</a><a href="/">Ver loja</a><button data-logout>Sair</button></nav></aside>
<main class="admin-main"><div class="toolbar"><h1 id="title">Cadastrar produto</h1><a href="/admin/products.html">← Voltar</a></div><p id="message" class="message hidden"></p>
<form id="product-form" class="form"><label>Nome<input name="name" required maxlength="120"></label><label>Descrição<textarea name="description" rows="5" required maxlength="5000"></textarea></label><div class="form-row"><label>Preço (R$)<input name="price" type="number" min="0.01" max="99999999.99" step="0.01" required></label><label>Categoria<select name="categoryId" required></select></label></div><label><span><input name="active" type="checkbox" checked style="width:auto"> Produto ativo</span></label><button class="button" type="submit">Salvar produto</button></form>
<section id="relations" class="form hidden"><hr><h2>Imagens</h2><form id="image-form"><label>Adicionar até 5 imagens<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label><button class="button secondary" type="submit">Enviar imagens</button></form><div id="images"></div><h2>Tamanhos e estoque</h2><form id="size-form" class="form-row"><label>Tamanho<input name="size" maxlength="20" required></label><label>Estoque<input name="stock" type="number" min="0" step="1" required></label><button class="button secondary" type="submit">Adicionar tamanho</button></form><div id="sizes"></div></section></main></div>
<script src="/js/common.js"></script><script src="/js/admin-product-form.js"></script></body></html>
